[project]
name = "curia-pipeline"
version = "0.1.0"
description = "Cross-species Unified ncRNA Inference and Annotation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "scikit-learn>=0.24",
    "numba>=0.59",     # compiled nt-Smith-Waterman in the RiNALMo island matcher
                       # (graceful pure-Python fallback if absent, but ~70x slower)
    "pandas>=1.3",
    "tqdm>=4.60",
    "pyrion>=0.4.0",  # fixes int32 chain-score overflow that silently
                      # dropped whole-chromosome chains (score > INT_MAX)
    # torch>=2.1 for a solid torch.nn.functional.scaled_dot_product_attention (SDPA).
    # RiNALMo attention uses SDPA -> memory-efficient/flash kernels on CUDA, O(L) memory,
    # so NO flash_attn package or CUDA build is required (works on CPU/MPS/CUDA alike).
    "torch>=2.1",
    "ptflops>=0.6",
    "ml_collections>=0.1.1",
    "gdown>=5.1.0",
]
